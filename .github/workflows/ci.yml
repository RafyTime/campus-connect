name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 💚 Quality Checks
    runs-on: ubuntu-latest
    env:
      # Values are used only to load the server during build and test. Production values live in Railway.
      DATABASE_URL: file:ci.db
      ORIGIN: http://127.0.0.1:4173
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-chars

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp run test:install --with-deps

      - name: Run quality gates
        run: vp run quality
