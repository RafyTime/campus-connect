name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 💚Quality Checks
    runs-on: ubuntu-latest
    env:
      # Values are used only to load the server during build and test. Production values live in Railway.
      DATABASE_URL: file:ci.db
      ORIGIN: http://127.0.0.1:4173
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-chars

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting
        run: bun run lint

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run unit and end-to-end tests
        run: bun run test
