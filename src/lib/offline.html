<!doctype html>
<html lang="en">
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
	<meta name="color-scheme" content="light dark" />
	<title>You're offline · Campus Connect</title>
	<script>
		// Match the application's device-local appearance preference before paint.
		try {
			const mode = localStorage.getItem('mode-watcher-mode');
			document.documentElement.dataset.mode =
				mode === 'light' || mode === 'dark'
					? mode
					: matchMedia('(prefers-color-scheme:dark)').matches
						? 'dark'
						: 'light';
		} catch {
			document.documentElement.dataset.mode = matchMedia('(prefers-color-scheme:dark)').matches
				? 'dark'
				: 'light';
		}
	</script>
	<style>
		body {
			margin: 0;
			font:
				16px/1.5 system-ui,
				sans-serif;
			background: #fafaf9;
			color: #1c1917;
		}
		header {
			padding: 20px max(20px, env(safe-area-inset-left));
			border-bottom: 1px solid #e7e5e4;
			font-weight: 600;
		}
		main {
			max-width: 380px;
			margin: 12vh auto;
			padding: 24px;
			text-align: center;
		}
		svg {
			width: 36px;
			height: 36px;
		}
		h1 {
			font-size: 24px;
			letter-spacing: -0.5px;
		}
		p {
			color: #78716c;
		}
		button {
			font: inherit;
			min-height: 44px;
			border: 0;
			border-radius: 10px;
			padding: 10px 24px;
			background: #292524;
			color: #fafaf9;
			cursor: pointer;
		}
		button:focus-visible {
			outline: 3px solid #a8a29e;
			outline-offset: 4px;
		}
		#connection {
			padding: 12px;
			text-align: center;
			border-bottom: 1px solid #e7e5e4;
		}
		#connection:empty {
			display: none;
		}
		html[data-mode='dark'] {
			color-scheme: dark;
		}
		html[data-mode='light'] {
			color-scheme: light;
		}
		html[data-mode='dark'] body {
			background: #1c1917;
			color: #fafaf9;
		}
		html[data-mode='dark'] header,
		html[data-mode='dark'] #connection {
			border-color: #44403c;
		}
		html[data-mode='dark'] p {
			color: #a8a29e;
		}
		html[data-mode='dark'] button {
			background: #fafaf9;
			color: #1c1917;
		}
	</style>
	<header>Campus Connect</header>
	<div id="connection" role="status" aria-live="polite"></div>
	<main>
		<svg
			aria-hidden="true"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="1.7"
			stroke-linecap="round"
		>
			<path
				d="m3 3 18 18M2 8.8a16 16 0 0 1 3-1.9m4-1.3A16 16 0 0 1 22 8.8M5 12a11 11 0 0 1 3-1.7m4-.6a11 11 0 0 1 7 2.3M8.5 15.5a5 5 0 0 1 7 0"
			/>
			<circle cx="12" cy="19" r="1" />
		</svg>
		<h1>You're offline</h1>
		<p>Campus Connect needs a connection to load this page. Reconnect, then try again.</p>
		<button type="button" id="retry">Retry</button>
	</main>
	<script>
		const notice = document.getElementById('connection');
		let timer;
		window.addEventListener('online', () => {
			notice.textContent = '✓ Back online.';
			clearTimeout(timer);
			timer = setTimeout(() => {
				notice.textContent = '';
			}, 4000);
		});
		window.addEventListener('offline', () => {
			clearTimeout(timer);
			notice.textContent = '';
		});
		document.getElementById('retry').addEventListener('click', () => location.reload());
	</script>
</html>
